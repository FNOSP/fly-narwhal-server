name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
      release_body:
        description: 'Release Changelog (更新日志)'
        required: true
        type: string

jobs:
  # The server ships as a GraalVM native image: no jar, no JVM on the target.
  # native-image only builds for the host architecture, so amd64 and arm64 each
  # need their own runner.
  native:
    name: Native binary (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout authx verifier (private)
        uses: actions/checkout@v4
        with:
          repository: Jankin-Wu/fly-narwhal-authx-verifier
          token: ${{ secrets.AUTHX_VERIFIER_REPO_TOKEN }}
          path: authx-verifier

      - name: Set up GraalVM JDK 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          cache: 'gradle'

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      # The landing page is a Vue app built by Vite; the Gradle task buildWebUi shells
      # out to npm, so Node must be on PATH before the Gradle build runs.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Debug environment
        env:
          FLY_NARWHAL_API_SECRET: ${{ secrets.FLY_NARWHAL_API_SECRET }}
          FLY_NARWHAL_BUILD_AUTHX_VERIFIER: '1'
          FLY_NARWHAL_AUTHX_VERIFIER_DIR: ${{ github.workspace }}/authx-verifier
        run: |
          echo "runner.os=${{ runner.os }}"
          echo "arch=${{ matrix.arch }}"
          echo "go=$(go version)"
          echo "java=$(java -version 2>&1 | head -n 1)"
          echo "native_image=$(native-image --version 2>&1 | head -n 1)"
          echo "authx_verifier_dir=$FLY_NARWHAL_AUTHX_VERIFIER_DIR"
          echo "authx_verifier_dir_exists=$(test -d "$FLY_NARWHAL_AUTHX_VERIFIER_DIR" && echo yes || echo no)"
          echo "fly_narwhal_api_secret_set=$(test -n "$FLY_NARWHAL_API_SECRET" && echo yes || echo no)"
          ls -la "$FLY_NARWHAL_AUTHX_VERIFIER_DIR" || true
          git -C "$FLY_NARWHAL_AUTHX_VERIFIER_DIR" rev-parse HEAD || true

      - name: Build native binary
        env:
          FLY_NARWHAL_API_SECRET: ${{ secrets.FLY_NARWHAL_API_SECRET }}
          FLY_NARWHAL_BUILD_AUTHX_VERIFIER: '1'
          FLY_NARWHAL_AUTHX_VERIFIER_DIR: ${{ github.workspace }}/authx-verifier
        # Unit tests are temporarily disabled in GitHub Actions.
        # run: ./gradlew --stacktrace --info :fly-narwhal-web:test :fly-narwhal-web:linkNativeBinary :fly-narwhal-web:verifyAuthxVerifierBinary
        run: ./gradlew --stacktrace --info :fly-narwhal-web:linkNativeBinary :fly-narwhal-web:verifyAuthxVerifierBinary

      - name: Package artifacts
        run: |
          set -euo pipefail
          NATIVE_DIR="fly-narwhal-web/build/native/nativeCompile"

          VERSION=$(./gradlew -q :fly-narwhal-web:properties --console=plain \
            | sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*/\1/p' | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "Could not resolve project version" >&2
            exit 1
          fi

          # linkNativeBinary emits this unversioned copy (hard link) next to the versioned one.
          BIN="$NATIVE_DIR/fly-narwhal-server"
          if [ ! -x "$BIN" ]; then
            echo "Native binary missing or not executable: $BIN" >&2
            ls -la "$NATIVE_DIR" >&2
            exit 1
          fi

          # Authx verifier ships as a standalone file next to the server binary; the server
          # resolves it from its own directory. Fail loudly rather than publish a tarball
          # that silently cannot verify signatures.
          AUTHX_SRC="fly-narwhal-web/build/generated-resources/authx-verifier/native/authx/linux-${{ matrix.arch }}/flynarwhal-authx"
          if [ ! -x "$AUTHX_SRC" ]; then
            echo "Authx verifier missing or not executable: $AUTHX_SRC" >&2
            find fly-narwhal-web/build/generated-resources/authx-verifier -type f 2>/dev/null >&2 || true
            exit 1
          fi

          NAME="fly-narwhal-server-linux-${{ matrix.arch }}-${VERSION}"
          mkdir -p dist/native

          # Only the archive is published: the binary needs its sibling lib*.so next to it,
          # so a lone executable would not run. tar also preserves the executable bit.
          # run.sh.example rides along so downloaders get the memory flags and the
          # start/stop wrapper without having to fetch it from the repo separately.
          cp "$AUTHX_SRC" "$NATIVE_DIR/flynarwhal-authx"
          cp "$GITHUB_WORKSPACE/run.sh.example" "$NATIVE_DIR/run.sh.example"
          ( cd "$NATIVE_DIR" && tar -czf "$GITHUB_WORKSPACE/dist/native/${NAME}.tar.gz" \
              fly-narwhal-server flynarwhal-authx run.sh.example lib*.so )

          echo "NAME=${NAME}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Build fnOS package (fpk)
        run: |
          set -euo pipefail
          # build-fpk.sh downloads fnpack 1.2.3 for this host and packs app/server/
          # from the native output. A Linux runner needs no root: fnpack's rpcbroker
          # shortcut only applies on a real fnOS device.
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            PLATFORM=arm
          else
            PLATFORM=x86
          fi
          ./fnosAppCenter/build-fpk.sh \
            --arch "${{ matrix.arch }}" \
            --platform "${PLATFORM}" \
            --bin-dir fly-narwhal-web/build/native/nativeCompile \
            --authx "fly-narwhal-web/build/generated-resources/authx-verifier/native/authx/linux-${{ matrix.arch }}/flynarwhal-authx" \
            --out-dir dist/fpk

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist/native
          sha256sum "${NAME}.tar.gz" > "SHA256SUMS.${{ matrix.arch }}"

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.arch }}
          retention-days: 7
          path: |
            dist/native/fly-narwhal-server-linux-*
            dist/fpk/*.fpk
            dist/native/SHA256SUMS.*

      - name: Upload build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fly-narwhal-web-reports-${{ matrix.arch }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            fly-narwhal-web/build/reports/**
            fly-narwhal-web/build/test-results/**
            build/reports/problems/**

  release:
    name: Publish release
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 产物放在 workspace 之外：后面的 Checkout code 会清空工作目录
      # （即使 clean: false，稀疏检出也会 Deleting the contents）。
      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: ${{ runner.temp }}/release/raw
          merge-multiple: true

      # artifact 解压后的目录结构随 upload-artifact 的公共祖先推断而变（见过
      # dist/native/、dist/fpk/、dist/native/fpk/ 三种），所以按文件名在整个目录下
      # 递归查找，不假设任何子目录。收集后应为 6 个：2 fpk + 2 tar.gz + 2 份
      # 分架构校验和；合并后是 5 个。
      - name: Collect release files
        run: |
          set -euo pipefail
          RAW="$RUNNER_TEMP/release/raw"
          OUT="$RUNNER_TEMP/release/files"
          echo "--- downloaded tree ---"
          find "$RAW" -type f -printf '%p  %s\n' | sort -k2 -n || true
          mkdir -p "$OUT"
          find "$RAW" -type f \( -name 'fly-narwhal-server-linux-*.tar.gz' \
            -o -name 'SHA256SUMS.*' -o -name '*.fpk' \) -exec mv {} "$OUT"/ \;
          echo "--- collected ---"
          ls -lh "$OUT"
          n=$(find "$OUT" -maxdepth 1 -type f | wc -l | tr -d ' ')
          test "$n" -eq 6 || { echo "::error::expected 6 files, collected $n"; exit 1; }

      - name: Merge checksums
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release/files"
          cat SHA256SUMS.* > SHA256SUMS
          rm -f SHA256SUMS.amd64 SHA256SUMS.arm64
          cat SHA256SUMS

      # 把文件逐个列出来交给发布步骤，两边都不涉及通配符。
      - name: List release files
        id: release_files
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release/files"
          ls -lh
          {
            echo "list<<EOF"
            find "$PWD" -maxdepth 1 -type f \
              \( -name 'fly-narwhal-server-linux-*.tar.gz' \
                 -o -name '*.fpk' -o -name 'SHA256SUMS' \) | sort
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "count=$(find "$PWD" -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.fpk' -o -name 'SHA256SUMS' \) | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Prepare Release Tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
          # checkout runs `git clean -ffdx` by default, which deletes the
          # artifacts downloaded in the previous step.
          clean: false

      - name: Generate Release Body
        if: steps.release_tag.outputs.tag != ''
        shell: bash
        run: |
          TAG_NAME="${{ steps.release_tag.outputs.tag }}"
          VERSION="${TAG_NAME#v}"

          # 与客户端一致：直接解析根目录 CHANGELOG.md，截取与 tag 同名的节
          # （标题形如 `## [X.Y.Z] - 日期`，`[X.Y.Z-alpha]` 也能匹配），整段作为更新日志。
          # 跳过 [Unreleased]；节内为空视为还没有写更新日志。
          # 用 python 自己的 heredoc，管道传给 python3，这样 YAML 块标量的缩进不会进入脚本。
          set +e
          NOTES=$(TAG_NAME="$TAG_NAME" VERSION="$VERSION" python3 - <<'PY'
          import os, re, sys

          tag = os.environ["TAG_NAME"]
          version = os.environ["VERSION"]

          try:
              with open("CHANGELOG.md", encoding="utf-8") as f:
                  text = f.read()
          except OSError as e:
              sys.exit(f"CHANGELOG.md not found: {e}")

          # Release: "v0.7.0-alpha", heading: "## [0.7.0-alpha] - 2026-10-11".
          # Accept the tag with or without its leading "v".
          heading = re.compile(r"^##\s+\[([^\]]+)\](.*)$", re.M)
          wanted = {tag.lower(), version.lower()}
          sections = []
          for m in heading.finditer(text):
              if m.group(1).strip().lower() not in wanted:
                  continue
              end = text.find("\n## ", m.end())
              body = (text[m.end():] if end == -1 else text[m.end():end]).strip()
              if body:
                  sections.append(body)
          if not sections:
              sys.exit(f"CHANGELOG.md has no non-empty section for {tag}")
          print(sections[0])
          PY
          )
          STATUS=$?
          set -e
          FALLBACK=false
          if [ "$STATUS" -ne 0 ]; then
            # 提醒但不阻断发布：更新日志应写在 CHANGELOG.md 里，没有就退回自动生成的说明。
            echo "::warning::$NOTES"
            NOTES=""
            FALLBACK=true
          fi

          # 如果是通过 GitHub 页面手动触发并输入了日志，则优先使用输入的内容
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_body }}" ]; then
            NOTES="${{ github.event.inputs.release_body }}"
            FALLBACK=false
          fi

          WARNING=""
          if [[ "$TAG_NAME" =~ [Aa]lpha ]]; then
            WARNING=$'\n\n> ⚠️ **此版本为测试版本（Alpha），仅供内部验证，禁止下载安装使用。**\n> ⚠️ **This is a test (Alpha) build for internal verification only. Do NOT download or install.**\n'
          fi

          {
            echo "RELEASE_BODY<<EOF"
            echo "$NOTES"
            echo "$WARNING"
            echo "EOF"
          } >> $GITHUB_ENV

      # action-gh-release 2.6.x 的 glob 在本仓库的 runner 上一个文件都匹配不到
      # （绝对路径、逐个文件名都一样），发布出过三次不带安装包的 Release。
      # 直接用 gh CLI，文件列表来自上一步的 find 结果。
      # 不用 `gh release edit`：仓库里有个早期失败的 draft 占着 v2.0.0 tag，
      # edit 会改到 draft 上并打出 untagged 地址，用 API 按 id 更新真正的 Release。
      - name: Create Release
        if: steps.release_tag.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_tag.outputs.tag }}
          FILES: ${{ steps.release_files.outputs.list }}
          RELEASE_BODY: ${{ env.RELEASE_BODY }}
        run: |
          set -euo pipefail
          # 清掉占着同一个 tag 的残留 draft，否则正式 Release 建不出来。
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\" and .draft) | .id" |
            while read -r id; do
              echo "deleting stale draft release $id"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            done

          PRE=""
          case "$TAG" in *-*) PRE="--prerelease";; esac
          # shellcheck disable=SC2086
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" --notes "$RELEASE_BODY" --latest $PRE

          mapfile -t files < <(printf '%s\n' "$FILES" | sed '/^$/d')
          echo "uploading ${#files[@]} file(s)"
          ls -l "${files[@]}"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"

      - name: Verify release assets
        if: steps.release_tag.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets \
            --jq '"draft=\(.isDraft)", (.assets[] | "\(.name) \(.size)")'
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')" -eq 5
