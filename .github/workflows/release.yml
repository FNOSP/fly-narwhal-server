name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
      release_body:
        description: 'Release Changelog (更新日志)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout authx verifier (private)
        uses: actions/checkout@v4
        with:
          repository: Jankin-Wu/fly-narwhal-authx-verifier
          token: ${{ secrets.AUTHX_VERIFIER_REPO_TOKEN }}
          path: authx-verifier

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Debug environment
        env:
          FLY_NARWHAL_API_SECRET: ${{ secrets.FLY_NARWHAL_API_SECRET }}
          FLY_NARWHAL_BUILD_AUTHX_VERIFIER: '1'
          FLY_NARWHAL_AUTHX_VERIFIER_DIR: ${{ github.workspace }}/authx-verifier
        run: |
          echo "runner.os=${{ runner.os }}"
          echo "go=$(go version)"
          echo "java=$(java -version 2>&1 | head -n 1)"
          echo "gradle=$(./gradlew --version | head -n 10)"
          echo "authx_verifier_dir=$FLY_NARWHAL_AUTHX_VERIFIER_DIR"
          echo "authx_verifier_dir_exists=$(test -d "$FLY_NARWHAL_AUTHX_VERIFIER_DIR" && echo yes || echo no)"
          echo "fly_narwhal_api_secret_set=$(test -n "$FLY_NARWHAL_API_SECRET" && echo yes || echo no)"
          ls -la "$FLY_NARWHAL_AUTHX_VERIFIER_DIR" || true
          git -C "$FLY_NARWHAL_AUTHX_VERIFIER_DIR" rev-parse HEAD || true

      - name: Build with Gradle
        env:
          FLY_NARWHAL_API_SECRET: ${{ secrets.FLY_NARWHAL_API_SECRET }}
          FLY_NARWHAL_BUILD_AUTHX_VERIFIER: '1'
          FLY_NARWHAL_AUTHX_VERIFIER_DIR: ${{ github.workspace }}/authx-verifier
        # Unit tests are temporarily disabled in GitHub Actions.
        # run: ./gradlew --stacktrace --info :fly-narwhal-web:test :fly-narwhal-web:bootJar :fly-narwhal-web:verifyAuthxVerifierBinary
        run: |
          git fetch --all --tags
          git checkout dev
          ./gradlew --stacktrace --info :fly-narwhal-web:bootJar :fly-narwhal-web:verifyAuthxVerifierBinary
          mkdir -p dist/dev
          cp fly-narwhal-web/build/libs/fly-narwhal-server-*.jar dist/dev/
          
          git checkout fn-app
          ./gradlew --stacktrace --info :fly-narwhal-web:bootJar :fly-narwhal-web:verifyAuthxVerifierBinary
          mkdir -p dist/fnapp
          for f in fly-narwhal-web/build/libs/fly-narwhal-server-*.jar; do
            cp "$f" "dist/fnapp/$(basename "$f").fnapp"
          done

      - name: Upload build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fly-narwhal-web-reports
          if-no-files-found: ignore
          retention-days: 7
          path: |
            fly-narwhal-web/build/reports/**
            fly-narwhal-web/build/test-results/**
            build/reports/problems/**

      - name: Prepare Release Tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Generate Release Body
        if: steps.release_tag.outputs.tag != ''
        shell: bash
        run: |
          TAG_NAME="${{ steps.release_tag.outputs.tag }}"

          # 在此处手动填写发布日志
          NOTES="1. 构建适配应用中心的 jar 包（需要客户端 1.10.0 及以上版本）"

          # 如果是通过 GitHub 页面手动触发并输入了日志，则优先使用输入的内容
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_body }}" ]; then
            NOTES="${{ github.event.inputs.release_body }}"
          fi

          WARNING=""
          if [[ "$TAG_NAME" =~ [Aa]lpha ]]; then
            WARNING=$'\n\n> **此版本为开发中的版本，请酌情下载安装。**\n'
          fi

          {
            echo "RELEASE_BODY<<EOF"
            echo "$NOTES"
            echo "$WARNING"
            echo "EOF"
          } >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: steps.release_tag.outputs.tag != ''
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          body: |
            ${{ env.RELEASE_BODY }}
          files: |
            dist/dev/fly-narwhal-server-*.jar
            dist/fnapp/fly-narwhal-server-*.jar.fnapp
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(steps.release_tag.outputs.tag, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
