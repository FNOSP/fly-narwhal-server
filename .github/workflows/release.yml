name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
      release_body:
        description: 'Release Changelog (更新日志)'
        required: true
        type: string

jobs:
  # The server ships as a GraalVM native image: no jar, no JVM on the target.
  # native-image only builds for the host architecture, so amd64 and arm64 each
  # need their own runner.
  native:
    name: Native binary (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout authx verifier (private)
        uses: actions/checkout@v4
        with:
          repository: Jankin-Wu/fly-narwhal-authx-verifier
          token: ${{ secrets.AUTHX_VERIFIER_REPO_TOKEN }}
          path: authx-verifier

      - name: Set up GraalVM JDK 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          cache: 'gradle'

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Debug environment
        env:
          FLY_NARWHAL_API_SECRET: ${{ secrets.FLY_NARWHAL_API_SECRET }}
          FLY_NARWHAL_BUILD_AUTHX_VERIFIER: '1'
          FLY_NARWHAL_AUTHX_VERIFIER_DIR: ${{ github.workspace }}/authx-verifier
        run: |
          echo "runner.os=${{ runner.os }}"
          echo "arch=${{ matrix.arch }}"
          echo "go=$(go version)"
          echo "java=$(java -version 2>&1 | head -n 1)"
          echo "native_image=$(native-image --version 2>&1 | head -n 1)"
          echo "authx_verifier_dir=$FLY_NARWHAL_AUTHX_VERIFIER_DIR"
          echo "authx_verifier_dir_exists=$(test -d "$FLY_NARWHAL_AUTHX_VERIFIER_DIR" && echo yes || echo no)"
          echo "fly_narwhal_api_secret_set=$(test -n "$FLY_NARWHAL_API_SECRET" && echo yes || echo no)"
          ls -la "$FLY_NARWHAL_AUTHX_VERIFIER_DIR" || true
          git -C "$FLY_NARWHAL_AUTHX_VERIFIER_DIR" rev-parse HEAD || true

      - name: Build native binary
        env:
          FLY_NARWHAL_API_SECRET: ${{ secrets.FLY_NARWHAL_API_SECRET }}
          FLY_NARWHAL_BUILD_AUTHX_VERIFIER: '1'
          FLY_NARWHAL_AUTHX_VERIFIER_DIR: ${{ github.workspace }}/authx-verifier
        # Unit tests are temporarily disabled in GitHub Actions.
        # run: ./gradlew --stacktrace --info :fly-narwhal-web:test :fly-narwhal-web:linkNativeBinary :fly-narwhal-web:verifyAuthxVerifierBinary
        run: ./gradlew --stacktrace --info :fly-narwhal-web:linkNativeBinary :fly-narwhal-web:verifyAuthxVerifierBinary

      - name: Package artifacts
        run: |
          set -euo pipefail
          NATIVE_DIR="fly-narwhal-web/build/native/nativeCompile"

          VERSION=$(./gradlew -q :fly-narwhal-web:properties --console=plain \
            | sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*/\1/p' | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "Could not resolve project version" >&2
            exit 1
          fi

          # linkNativeBinary emits this unversioned copy (hard link) next to the versioned one.
          BIN="$NATIVE_DIR/fly-narwhal-server"
          if [ ! -x "$BIN" ]; then
            echo "Native binary missing or not executable: $BIN" >&2
            ls -la "$NATIVE_DIR" >&2
            exit 1
          fi

          NAME="fly-narwhal-server-linux-${{ matrix.arch }}-${VERSION}"
          mkdir -p dist/native

          # Only the archive is published: the binary needs its sibling lib*.so next to it,
          # so a lone executable would not run. tar also preserves the executable bit.
          ( cd "$NATIVE_DIR" && tar -czf "$GITHUB_WORKSPACE/dist/native/${NAME}.tar.gz" \
              fly-narwhal-server lib*.so )

          echo "NAME=${NAME}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist/native
          sha256sum "${NAME}.tar.gz" > "SHA256SUMS.${{ matrix.arch }}"

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.arch }}
          retention-days: 7
          path: |
            dist/native/fly-narwhal-server-linux-*
            dist/native/SHA256SUMS.*

      - name: Upload build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fly-narwhal-web-reports-${{ matrix.arch }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            fly-narwhal-web/build/reports/**
            fly-narwhal-web/build/test-results/**
            build/reports/problems/**

  release:
    name: Publish release
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist/native
          merge-multiple: true

      - name: Merge checksums
        run: |
          set -euo pipefail
          cd dist/native
          cat SHA256SUMS.* > SHA256SUMS
          rm -f SHA256SUMS.amd64 SHA256SUMS.arm64
          cat SHA256SUMS

      - name: Prepare Release Tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Generate Release Body
        if: steps.release_tag.outputs.tag != ''
        shell: bash
        run: |
          TAG_NAME="${{ steps.release_tag.outputs.tag }}"

          # 在此处手动填写发布日志
          NOTES="1. 修复应用中心应用自动更新失败的问题（需要客户端 1.10.0 及以上版本）"

          # 如果是通过 GitHub 页面手动触发并输入了日志，则优先使用输入的内容
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_body }}" ]; then
            NOTES="${{ github.event.inputs.release_body }}"
          fi

          WARNING=""
          if [[ "$TAG_NAME" =~ [Aa]lpha ]]; then
            WARNING=$'\n\n> **此版本为开发中的版本，请酌情下载安装。**\n'
          fi

          {
            echo "RELEASE_BODY<<EOF"
            echo "$NOTES"
            echo "$WARNING"
            echo "EOF"
          } >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: steps.release_tag.outputs.tag != ''
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          body: |
            ${{ env.RELEASE_BODY }}
          files: |
            dist/native/fly-narwhal-server-linux-*
            dist/native/SHA256SUMS
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(steps.release_tag.outputs.tag, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The fnOS AppCenter app is packaged from the fn-app-0127 branch, which carries the
  # fnpack tool and the app templates. It still bundles a jar and declares a
  # java-21-openjdk dependency; moving it onto the native binary means changing those
  # templates, which is deliberately out of scope here.
  fnos:
    name: Publish fnOS app
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout fn-app-0127 (fnpack app source)
        uses: actions/checkout@v4
        with:
          ref: fn-app-0127
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare Release Tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Build fnOS app package
        env:
          FLY_NARWHAL_API_SECRET: ${{ secrets.FLY_NARWHAL_API_SECRET }}
          FLY_NARWHAL_BUILD_AUTHX_VERIFIER: '1'
        run: |
          set -euo pipefail
          ./gradlew --stacktrace --info :fly-narwhal-web:bootJar :fly-narwhal-web:verifyAuthxVerifierBinary

          FNAPP_JAR=$(ls -t fly-narwhal-web/build/libs/fly-narwhal-server-*.jar | head -n 1)
          mkdir -p fnosAppCenter/App.Native.flyNarwhalServer/app/server
          cp "$FNAPP_JAR" fnosAppCenter/App.Native.flyNarwhalServer/app/server/fly-narwhal-server.jar

          cd fnosAppCenter
          chmod +x fnpack-1.2.0-linux-amd64
          ./fnpack-1.2.0-linux-amd64 build --directory App.Native.flyNarwhalServer

          VERSION=$(grep -E '^version\s*=' App.Native.flyNarwhalServer/manifest | sed -E 's/.*=\s*([0-9.]+).*/\1/')
          VERSION_UNDERSCORED=$(echo "$VERSION" | tr '.' '_')
          mkdir -p ../dist/fpk
          mv App.Native.flyNarwhalServer.fpk \
            "../dist/fpk/App.Native.flyNarwhalServer.amd64.${VERSION_UNDERSCORED}.fpk"

      - name: Upload fnOS package to release
        if: steps.release_tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: dist/fpk/*.fpk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
