name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
      release_body:
        description: 'Release Changelog (更新日志)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew :fly-narwhal-web:bootJar -x test

      - name: Prepare Release Tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Generate Release Body
        if: steps.release_tag.outputs.tag != ''
        shell: bash
        run: |
          TAG_NAME="${{ steps.release_tag.outputs.tag }}"

          NOTES="实现片头/片尾智能检测"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NOTES="${{ github.event.inputs.release_body }}"
          else
            TAG_MESSAGE="$(git for-each-ref "refs/tags/${TAG_NAME}" --format='%(contents)')"
            if [ -z "$TAG_MESSAGE" ]; then
              echo "Release notes not found for tag '${TAG_NAME}'." >&2
              echo "Please use an annotated tag, e.g.:" >&2
              echo "  git tag -a ${TAG_NAME} -m \"your changelog\"" >&2
              echo "Or run this workflow with workflow_dispatch and provide 'release_body'." >&2
              exit 1
            fi
            NOTES="$TAG_MESSAGE"
          fi

          WARNING=""
          if [[ "$TAG_NAME" =~ [Aa]lpha ]]; then
            WARNING=$'\n\n> **此版本为开发中的版本，请酌情下载安装。**\n'
          fi

          {
            echo "RELEASE_BODY<<EOF"
            echo "$NOTES"
            echo "$WARNING"
            echo "EOF"
          } >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: steps.release_tag.outputs.tag != ''
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          body: |
            ${{ env.RELEASE_BODY }}
          files: |
            fly-narwhal-web/build/libs/fly-narwhal-server-*.jar
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(steps.release_tag.outputs.tag, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
