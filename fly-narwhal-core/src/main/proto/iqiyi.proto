syntax = "proto3";
package com.jankinwu.flynarwhal.core.danmu.proto;

option java_multiple_files = true;
option java_package = "com.jankinwu.flynarwhal.core.danmu.proto";

// Wire layout confirmed against live cmts.iqiyi.com data:
// top-level field 6 -> entries; entry field 1 -> segment second, field 2 -> items;
// item field 2 -> content, field 6 -> showTime (seconds within the segment), field 8 -> color hex.
message IqiyiDanmu {
    repeated IqiyiEntry entry = 6;
}

message IqiyiEntry {
    // Segment second this entry covers; the danmaku time is segmentSecond + item.showTime.
    string segmentSecond = 1;
    repeated IqiyiBulletInfo bulletInfo = 2;
}

message IqiyiBulletInfo {
    string content = 2;
    string showTime = 6;
    string a8 = 8;
}
