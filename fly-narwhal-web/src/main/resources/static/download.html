        .download-grid {

        .card {

            transition: var(--transition);

            align-items: center;
        }

        .card:hover {

        }

        .os-icon {
            width: 64px;
            height: 64px;
            margin-bottom: 20px;
            fill: #707070;
        }

        .os-name {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .btn-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--primary-color);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
            width: 100%;
        }

        .download-btn:hover {
            background-color: #0062CC;
            filter: brightness(1.1);
        }

        .download-btn span {
            font-size: 14px;
            opacity: 0.9;
            margin-left: 8px;
        }

        .footer {

            font-size: 14px;
        }
