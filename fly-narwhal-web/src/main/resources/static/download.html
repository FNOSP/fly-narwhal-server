<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飞鲸影视 - 客户端下载</title>
    <style>
        :root {
            --primary-color: #007AFF;
            --bg-color: #F5F5F7;
            --card-bg: #FFFFFF;
            --text-main: #1D1D1F;
            --text-sub: #86868B;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            text-align: center;
        }

        .header {
            margin-bottom: 60px;
        }

        .logo {
            max-width: 480px;
            margin-bottom: 24px;
            transition: var(--transition);
        }

        .logo:hover {
            transform: scale(1.02);
        }

        .header-title {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        h1 {
            font-size: 40px;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 18px;
            color: var(--text-sub);
            max-width: 600px;
            margin: 0 auto;
        }

        .intro {
            margin-top: 28px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .intro-card {
            width: 100%;
            max-width: 1000px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 18px 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
            transition: var(--transition);
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
        }

        .intro-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08);
        }

        .intro-main {
            flex: 1;
            min-width: 0;
        }

        .intro-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 0.2px;
            color: var(--text-sub);
        }

        .intro-text {
            font-size: 14px;
            color: var(--text-sub);
            line-height: 1.7;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .intro-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        .repo-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            background: rgba(255, 255, 255, 0.75);
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .repo-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            border-color: rgba(0, 0, 0, 0.12);
        }

        .repo-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            opacity: 0.9;
        }

        .repo-btn span {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-sub);
        }

        .download-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-top: 40px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08);
        }

        .os-icon {
            width: 64px;
            height: 64px;
            margin-bottom: 20px;
            fill: #707070;
        }

        .os-name {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .btn-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--primary-color);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
            width: 100%;
        }

        .download-btn:hover {
            background-color: #0062CC;
            filter: brightness(1.1);
        }

        .download-btn span {
            font-size: 14px;
            opacity: 0.9;
            margin-left: 8px;
        }

        .footer {
            margin-top: 80px;
            color: var(--text-sub);
            font-size: 14px;
        }

        @media (max-width: 600px) {
            h1 { font-size: 32px; }
            .download-grid { grid-template-columns: 1fr; }
            .intro-card { padding: 18px 16px; flex-direction: column; align-items: stretch; }
            .intro-actions { justify-content: flex-start; }
            .repo-btn { justify-content: center; width: 100%; }
        }

        .auth-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background-color: var(--primary-color);
            color: white;
            border-radius: 12px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: var(--transition);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .auth-btn:hover {
            background-color: #0062CC;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 9999;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            width: 100%;
            max-width: 560px;
            background: var(--card-bg);
            border-radius: 18px;
            box-shadow: 0 18px 60px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }

        .modal-header {
            padding: 18px 20px 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 600;
        }

        .modal-close {
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
            color: var(--text-sub);
            padding: 4px 8px;
            border-radius: 10px;
            transition: var(--transition);
        }

        .modal-close:hover {
            background: rgba(0, 0, 0, 0.04);
            color: var(--text-main);
        }

        .modal-body {
            padding: 16px 20px 20px 20px;
            text-align: left;
        }

        .modal-desc {
            color: var(--text-sub);
            font-size: 13px;
            line-height: 1.7;
            margin-bottom: 14px;
        }

        .auth-code-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .auth-code-input {
            flex: 1;
            min-width: 0;
            padding: 12px 12px;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.12);
            outline: none;
            font-size: 13px;
            background: rgba(245, 245, 247, 0.7);
            color: var(--text-main);
        }

        .copy-btn {
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.12);
            background: rgba(255, 255, 255, 0.9);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: var(--transition);
            white-space: nowrap;
        }

        .copy-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
        }

        .copy-btn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
            box-shadow: none;
            transform: none;
        }
    </style>
</head>

<button class="auth-btn" onclick="getAuthCode()">获取授权码</button>

    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="authModalTitle">
        <div class="modal-header">
            <div id="authModalTitle" class="modal-title">授权码</div>
            <button class="modal-close" onclick="closeAuthModal()" aria-label="关闭">×</button>
        </div>
        <div class="modal-body">
            <div id="authModalDesc" class="modal-desc"></div>
            <div id="authCodeRow" class="auth-code-row" style="display: none;">
                <input id="authCodeInput" class="auth-code-input" type="text" readonly />

            </div>
        </div>
    </div>

<script>
    let lastAuthCode = '';

    function openAuthModal(title, desc, authCode) {
        const overlay = document.getElementById('authModal');
        const titleEl = document.getElementById('authModalTitle');
        const descEl = document.getElementById('authModalDesc');
        const rowEl = document.getElementById('authCodeRow');
        const inputEl = document.getElementById('authCodeInput');
        const copyBtn = document.getElementById('copyBtn');

        titleEl.textContent = title;
        descEl.textContent = desc;

        if (authCode && authCode.trim().length > 0) {
            lastAuthCode = authCode.trim();
            inputEl.value = lastAuthCode;
            rowEl.style.display = 'flex';
            copyBtn.disabled = false;
        } else {
            lastAuthCode = '';
            inputEl.value = '';
            rowEl.style.display = 'none';
            copyBtn.disabled = true;
        }

        overlay.classList.add('show');
        overlay.setAttribute('aria-hidden', 'false');
    }

    function closeAuthModal() {
        const overlay = document.getElementById('authModal');
        overlay.classList.remove('show');
        overlay.setAttribute('aria-hidden', 'true');
    }

    function handleOverlayClick(e) {
        if (e.target && e.target.id === 'authModal') {
            closeAuthModal();
        }
    }

    async function copyAuthCode() {
        if (!lastAuthCode) {
            return;
        }

        const copyBtn = document.getElementById('copyBtn');
        copyBtn.disabled = true;

        try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(lastAuthCode);
            } else {
                const inputEl = document.getElementById('authCodeInput');
                inputEl.focus();
                inputEl.select();
                document.execCommand('copy');
                inputEl.setSelectionRange(0, 0);
            }
            copyBtn.textContent = '已复制';
            setTimeout(() => {
                copyBtn.textContent = '复制';
                copyBtn.disabled = false;
            }, 1200);
        } catch (e) {
            copyBtn.textContent = '复制失败';
            setTimeout(() => {
                copyBtn.textContent = '复制';
                copyBtn.disabled = false;
            }, 1500);
        }
    }

    async function getAuthCode() {
        try {
            const response = await fetch('/api/config/auth-code', {
                method: 'POST'
            });
            const result = await response.json();
            if (result.code === 200) {
                if (result.data === 'exists') {
                    openAuthModal('授权码', '授权码已存在。如需重新生成，请删除飞鲸服务端 jar 文件所在目录下的 auth_code 文件后再次获取。', '');
                } else {
                    openAuthModal('授权码', '此授权码只展示一次，请立即复制并妥善保存！', result.data);
                }
            } else {
                openAuthModal('获取失败', result.msg || '未知错误', '');
            }
        } catch (e) {
            openAuthModal('请求失败', String(e), '');
        }
    }
</script>
