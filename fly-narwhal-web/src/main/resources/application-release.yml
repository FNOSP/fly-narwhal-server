spring:
  datasource:
    url: ${FN_DB_URL:jdbc:h2:file:/var/apps/App.Native.flyNarwhalServer/shares/data/fly-narwhal;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;CACHE_SIZE=8192}
    driver-class-name: org.h2.Driver
    username: sa
    password: 123456
  sql:
    init:
      mode: never

fly-narwhal:
  # Base directory for runtime data files (auth_code, authx verifier, danmu cache).
  data-dir: ${FN_DATA_DIR:/var/apps/App.Native.flyNarwhalServer/shares/data}

danmu:
  cache:
    dir: ${DANMU_CACHE_DIR:/var/apps/App.Native.flyNarwhalServer/shares/data/danmu-cache}
