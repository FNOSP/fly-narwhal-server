spring:
  profiles:
    active: release
  application:
    name: fly-narwhal-server
  main:
    # Instantiate beans on first use instead of at startup; keeps the native
    # image's heap small on a low-concurrency NAS deployment.
    lazy-initialization: true
  datasource:
    # CACHE_SIZE caps H2's in-memory page cache (KB). The embedded default of
    # 64MB is far more than this workload needs.
    url: jdbc:h2:file:./data/fly-narwhal;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;CACHE_SIZE=8192
    driver-class-name: org.h2.Driver
    username: sa
    password: 123456
  sql:
    init:
      mode: never

server:
  port: 5365
  tomcat:
    uri-encoding: UTF-8
    threads:
      # SSE uses async emitters and holds no container thread, so the default
      # 200 worker threads are pure overhead here.
      max: 24
      min-spare: 4

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    # Drop the session-scoped first-level cache: every mapper call is a
    # one-shot query here, holding results per session only wastes heap.
    local-cache-scope: STATEMENT
  global-config:
    db-config:
      id-type: auto

logging:
  # logback.xml配置文件的位置
  config: classpath:logback-spring.xml
  level:
    root: INFO
    # SQL statement logging is DEBUG, but logback-spring.xml pins it to the
    # rolling file appender only — the console and root stay at INFO.
    com.baomidou: DEBUG
    com.jankinwu.flynarwhal.web.mapper: DEBUG

fly-narwhal:
  api-secret: ${FLY_NARWHAL_API_SECRET:16CCEB3D-AB42-077D-36A1-F355324E4237}
  client-version:
    # Minimum client version required for non-/api/config endpoints.
    # Clients below this version receive a 4001 code with an upgrade prompt;
    # clients sending no version header (legacy) are always allowed.
    min-version: ${FLY_NARWHAL_CLIENT_MIN_VERSION:2.4.0}

danmu:
  cache:
    dir: ${DANMU_CACHE_DIR:./data/danmu-cache}
    max-files: 100
    # Full results live for a month; sparse results (fewer than min-count
    # entries, i.e. likely incomplete fetches) expire after an hour so they
    # get re-crawled soon. Empty results are never cached at all.
    ttl-days: 30
    sparse-ttl-minutes: 60
    min-count: 100
  post:
    # Post-processing runs per request on the RAW cached payload, so changing
    # any of these takes effect immediately without purging the cache.
    # Per-title time offset rules, most specific wins:
    #   剧名:秒, 剧名/S01:秒, 剧名/S01/E03:秒  (negative = earlier)
    offset-rules: ${DANMU_POST_OFFSET_RULES:}
    # Collapse identical text within n-minute buckets (0 = off).
    dedupe-minutes: 1
    # Blocked words, "|"-separated; each entry is a literal or /regex/ with
    # optional i/m/s flags, e.g. "^\\d{2,4}[-/.]\\d{1,2}[-/.]\\d{1,2}$|打卡"
    blocked-words: ${DANMU_POST_BLOCKED_WORDS:}
    # Cap total entries in thousands by equal-interval sampling (0 = off).
    limit-k: ${DANMU_POST_LIMIT_K:0}
    # Convert top(5)/bottom(4) danmu to scrolling(1) for players lacking support.
    top-bottom-to-scroll: ${DANMU_POST_TOP_BOTTOM_TO_SCROLL:false}
    # default | white (force all white) | color (white entries get a pool color)
    color-mode: ${DANMU_POST_COLOR_MODE:default}
    # Decimal RGB pool for color-mode=color; empty uses the built-in 9 colors.
    color-pool: ""
  match:
    # Preferred platform ranking for candidate play URLs, ","-separated
    # (qq/tencent, iqiyi/qiyi, bilibili/bili, youku, mgtv/mango, sohu, or any
    # domain fragment); empty keeps the built-in qq > iqiyi > bilibili > youku
    # > mgtv > sohu.
    platform-order: ${DANMU_MATCH_PLATFORM_ORDER:}
    # Exact whole-title replacements applied before searching, ";"-separated,
    # each "原始标题->映射标题".
    title-mapping: ${DANMU_MATCH_TITLE_MAPPING:}
    # Regex noise stripped from titles before searching, ";;"-separated;
    # empty uses the built-in default (（真彩）/【4K】/(完整版) brackets).
    noise-patterns: ${DANMU_MATCH_NOISE_PATTERNS:}
    # Require candidate titles to equal/prefix the query token and disable the
    # "any first row" fallback (searching 遮天 must not land on 古惑仔3之只手遮天).
    strict-title: ${DANMU_MATCH_STRICT_TITLE:false}
  source:
    # Last-resort third-party danmu server with the dandanplay-compatible
    # "?url=<play page>&ac=dm" contract (e.g. https://api.danmu.icu), queried
    # only when every direct source returned nothing. Empty = disabled.
    fallback-server: ${DANMU_SOURCE_FALLBACK_SERVER:}
