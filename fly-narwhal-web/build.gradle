import java.time.OffsetDateTime
import java.time.ZoneOffset

plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    implementation project(':fly-narwhal-core')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'com.baomidou:mybatis-plus-spring-boot3-starter:3.5.9'
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    runtimeOnly 'com.h2database:h2'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

bootJar {
    archiveFileName = "fly-narwhal-server-${project.version}.jar"
}

def generatedVersionSrcDir = layout.buildDirectory.dir("generated/sources/version/java")

tasks.register('generateVersionConfig') {
    outputs.dir(generatedVersionSrcDir)
    outputs.upToDateWhen { false }
    doLast {
        def dir = generatedVersionSrcDir.get().asFile
        def packagePath = new File(dir, "com/jankinwu/flynarwhal/web/config")
        packagePath.mkdirs()

        def buildTime = OffsetDateTime.now(ZoneOffset.ofHours(8)).toString()
        def baseVersion = project.ext.baseVersion?.toString() ?: project.version.toString()
        def version = project.version.toString()

        def file = new File(packagePath, "BuildVersionConfiguration.java")
        file.text =
            "package com.jankinwu.flynarwhal.web.config;\n" +
            "\n" +
            "import org.springframework.context.annotation.Bean;\n" +
            "import org.springframework.context.annotation.Configuration;\n" +
            "\n" +
            "@Configuration\n" +
            "public class BuildVersionConfiguration {\n" +
            "    public static final String VERSION = \"" + version + "\";\n" +
            "    public static final String BASE_VERSION = \"" + baseVersion + "\";\n" +
            "    public static final String BUILD_TIME = \"" + buildTime + "\";\n" +
            "\n" +
            "    @Bean\n" +
            "    public BuildVersionInfo buildVersionInfo() {\n" +
            "        return new BuildVersionInfo(VERSION, BASE_VERSION, BUILD_TIME);\n" +
            "    }\n" +
            "\n" +
            "    public static final class BuildVersionInfo {\n" +
            "        private final String version;\n" +
            "        private final String baseVersion;\n" +
            "        private final String buildTime;\n" +
            "\n" +
            "        public BuildVersionInfo(String version, String baseVersion, String buildTime) {\n" +
            "            this.version = version;\n" +
            "            this.baseVersion = baseVersion;\n" +
            "            this.buildTime = buildTime;\n" +
            "        }\n" +
            "\n" +
            "        public String getVersion() {\n" +
            "            return version;\n" +
            "        }\n" +
            "\n" +
            "        public String getBaseVersion() {\n" +
            "            return baseVersion;\n" +
            "        }\n" +
            "\n" +
            "        public String getBuildTime() {\n" +
            "            return buildTime;\n" +
            "        }\n" +
            "    }\n" +
            "}\n"
    }
}

sourceSets {
    main {
        java {
            srcDir(generatedVersionSrcDir)
        }
    }
}

tasks.register('generateSecretConfig') {
    outputs.dir(generatedVersionSrcDir)
    outputs.upToDateWhen { false }
    doLast {
        def envSecret = System.getenv("FLY_NARWHAL_API_SECRET")
        def customDeobf = System.getenv("FLY_NARWHAL_CUSTOM_DEOBF")
        def obfLogic = System.getenv("FLY_NARWHAL_OBF_LOGIC")
        
        def dataBytes = []
        def keyBytes = [0x4A, 0x6E, 0x6B, 0x69, 0x6E] // 默认占位 Key
        def methodBody = "return new String(_BUF_D, StandardCharsets.UTF_8);"
        
        if (envSecret && customDeobf && obfLogic) {
            // 从环境变量动态执行混淆算法
            try {
                def shell = new GroovyShell(new Binding([secret: envSecret.trim()]))
                def result = shell.evaluate(obfLogic)
                dataBytes = result.data
                keyBytes = result.keys
                methodBody = customDeobf
            } catch (Exception e) {
                throw new GradleException("Failed to execute custom obfuscation logic: " + e.message)
            }
        } else {
            // 返回硬编码的默认明文密钥
            def defaultSecret = "16CCEB3D-AB42-077D-36A1-F355324E4237"
            dataBytes = defaultSecret.getBytes("UTF-8").collect { it & 0xFF }
        }
        
        def dataStr = dataBytes.collect { "(byte) " + String.format("0x%02x", it) }.join(", ")
        def keysStr = keyBytes.collect { "(byte) " + String.format("0x%02x", it) }.join(", ")

        def dir = generatedVersionSrcDir.get().asFile
        def packagePath = new File(dir, "com/jankinwu/flynarwhal/web/security")
        packagePath.mkdirs()

        def file = new File(packagePath, "SecurityBufferManager.java")
        file.text = """package com.jankinwu.flynarwhal.web.security;

import java.nio.charset.StandardCharsets;

/**
 * Internal Security Buffer Manager
 * Generated at build time.
 */
public final class SecurityBufferManager {
    private static final byte[] _BUF_D = { ${dataStr} };
    private static final byte[] _BUF_K = { ${keysStr} };

    public static String getSecret(int type) {
        if (type != 0xAF) return null;
        ${methodBody}
    }
}
"""
    }
}

tasks.named('compileJava') {
    dependsOn(tasks.named('generateVersionConfig'))
    dependsOn(tasks.named('generateSecretConfig'))
}
