import java.security.MessageDigest
import java.time.OffsetDateTime
import java.time.ZoneOffset
import java.time.format.DateTimeFormatter

plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'org.graalvm.buildtools.native'
}

dependencies {
    implementation project(':fly-narwhal-core')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'com.baomidou:mybatis-plus-spring-boot3-starter:3.5.9'
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    runtimeOnly 'com.h2database:h2'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

graalvmNative {
    binaries {
        main {
            imageName = "fly-narwhal-server-${project.version}"
            buildArgs = [
                // MyBatis LogFactory resolves its logger impl reflectively in a static
                // initializer. Under native AOT that init runs at build time, the Slf4jImpl
                // constructor's own reflective method lookup fails (LocationAwareLogger#log
                // not registered), poisoning LogFactory permanently — every later getLog()
                // throws with an NPE cause. Force the logging package runtime-initialized;
                // warmup in main() pre-selects Slf4jImpl before Spring touches it.
                '--initialize-at-run-time=org.apache.ibatis.logging',
                '-H:Class=com.jankinwu.flynarwhal.FlyNarwhalServerApplication',
                '-H:+AddAllCharsets'
            ]
        }
    }
}

// The versioned binary name changes every release, which would force the Dockerfile and
// the release workflow to hardcode a version. Emit an unversioned copy alongside it so
// both can reference a stable path; the version still reaches users via the release asset
// name and the jar-style BuildVersionConfiguration baked into the image.
tasks.register('linkNativeBinary') {
    dependsOn(tasks.named('nativeCompile'))
    doLast {
        def outDir = new File(layout.buildDirectory.get().asFile, 'native/nativeCompile')
        def versioned = new File(outDir, "fly-narwhal-server-${project.version}")
        def stable = new File(outDir, 'fly-narwhal-server')

        if (!versioned.exists()) {
            throw new GradleException("Native binary missing: ${versioned.absolutePath}")
        }
        if (stable.exists()) {
            stable.delete()
        }

        // Prefer a hard link: same inode, so the ~150MB binary is not duplicated. Some
        // filesystems (and some CI sandboxes) disallow links, so fall back to a full copy
        // rather than failing the build over it.
        try {
            java.nio.file.Files.createLink(stable.toPath(), versioned.toPath())
        } catch (Exception e) {
            logger.lifecycle("Hard link unavailable (${e.class.simpleName}); copying instead")
            java.nio.file.Files.copy(versioned.toPath(), stable.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
        stable.setExecutable(true)
    }
}

// mybatis-spring 3.0.x AOT bug (mybatis/spring#929): the generated bean definitions for
// MapperFactoryBean carry a raw Class<?> "mapperInterface" property value whose setter is
// autowire-candidate material — under native-image Spring then tries to inject a
// java.lang.Class<?> bean into each mapper and fails at startup. The constructor arg alone
// sets the interface (identical effect to JVM), so strip that property assignment from the
// AOT-generated sources before they are compiled into the image.
tasks.register('patchAotSources') {
    dependsOn tasks.named('processAot')
    outputs.upToDateWhen { false }
    doLast {
        def aotRoot = new File(layout.buildDirectory.get().asFile, 'generated/aotSources')

        // mybatis-spring 3.0.x AOT bug (mybatis/spring#929): generated MapperFactoryBean
        // definitions instantiate through BeanInstanceSupplier.forConstructor(Class.class) and
        // are left on by-type/constructor autowiring, so under native-image Spring tries to
        // resolve java.lang.Class<?> as an autowire candidate for every mapper and fails at
        // startup. Replace each definition with fully explicit wiring — indexed Class constructor
        // arg + no injection fallback anywhere. That is semantically identical to the JVM path.
        def registrations = new File(aotRoot, 'com/jankinwu/flynarwhal/FlyNarwhalServerApplication__BeanFactoryRegistrations.java')
        if (registrations.exists()) {
            def text = registrations.text
            // The registrar replay at image runtime double-registers mappers (the same beans exist
            // from our patched definitions); allow overrides so it is a harmless overwrite.
            text = text.replace('public void registerBeanDefinitions(DefaultListableBeanFactory beanFactory) {',
                    'public void registerBeanDefinitions(DefaultListableBeanFactory beanFactory) {\n    beanFactory.setAllowBeanDefinitionOverriding(true);')
            text = text.replace('import org.mybatis.spring.mapper.MapperFactoryBean;',
                                'import org.mybatis.spring.mapper.MapperFactoryBean;\nimport com.jankinwu.flynarwhal.web.mapper.*;')
            def mapperDefPattern = ~/(?s)(  private static BeanDefinition get(\w+Mapper)BeanDefinition\(\) \{)(.*?)(\n  \})/
            text = text.replaceAll(mapperDefPattern) { m ->
                def header = m[1]
                def name = m[2]
                def body = m[3]
                def tail = m[4]
                if (!body.contains('MapperFactoryBean')) return m[0]
                // mybatis/spring#929 native fix: the stock scanner output adds a raw Class<?>
                // "mapperInterface" property while leaving definitions on by-type/constructor
                // autowiring, so at image runtime Spring resolves java.lang.Class<?> as an autowire
                // candidate for every mapper and startup fails. The AOT supplier also converts via
                // resolveAutowiredArgument when its value holder is null — same trap. Rewrite each
                // definition with fully explicit values ONLY (indexed String ctor arg + Class-typed
                // indexed arg, no supplier) and AUTOWIRE_NO; nothing is left to inject.
                "${header}\n" +
                "    RootBeanDefinition beanDefinition = new RootBeanDefinition(MapperFactoryBean.class);\n" +
                "    beanDefinition.setTargetType(ResolvableType.forClass(MapperFactoryBean.class));\n" +
                // mybatis/spring#929 native fix: concrete values only — String generic ctor arg (the
                // JVM scanner path's shape; resolveConstructorArguments converts it, no lookup),
                // explicit sqlSessionFactory reference, AUTOWIRE_NO so nothing is injected at all.
                "    beanDefinition.getConstructorArgumentValues().addGenericArgumentValue(\"com.jankinwu.flynarwhal.web.mapper.${name}\");\n" +
                "    beanDefinition.getPropertyValues().addPropertyValue(\"mapperInterface\", ${name}.class);\n" +
                "    beanDefinition.getPropertyValues().add(\"addToConfig\", true);\n" +
                "    beanDefinition.getPropertyValues().add(\"sqlSessionFactory\", new org.springframework.beans.factory.config.RuntimeBeanReference(\"sqlSessionFactory\"));\n" +
                "    beanDefinition.setAutowireMode(org.springframework.beans.factory.support.AbstractBeanDefinition.AUTOWIRE_NO);\n" +
                "    beanDefinition.setLazyInit(false);\n" +
                "    return beanDefinition;${tail}"
            }
            // Drop the registrar's registration line entirely — AOT instantiated abstract
            // definitions regardless; removing the call is what actually prevents the stock scan
            // from replaying at image runtime. Mapper beans themselves already exist above.
            text = text.replaceAll(/(?m)^\s*beanFactory\.registerBeanDefinition\("[^"]*#MapperScannerRegistrar#0", *MapperScannerConfigurer__BeanDefinitions\.getFlyNarwhalServerApplicationMapperScannerRegistrarBeanDefinition\(\)\);\r?\n/, '')
            registrations.text = text
        }

        // Neutralize the scanner bean itself: MapperScannerConfigurer.postProcessBeanDefinitionRegistry
        // runs when the bean is instantiated (as a BeanFactoryPostProcessor), re-scanning and
        // overwriting our explicit mapper definitions with the raw Class<?> property wiring that
        // breaks native autowiring. Rewrite its generated definition to an abstract no-op; also
        // drop any raw Class-typed filter property values that survive into it.
        def registrarDef = new File(aotRoot, 'org/mybatis/spring/mapper/MapperScannerConfigurer__BeanDefinitions.java')
        if (registrarDef.exists()) {
            def s = registrarDef.text
            s = s.replaceAll(/(?s)(  public static BeanDefinition getFlyNarwhalServerApplicationMapperScannerRegistrarBeanDefinition\(\s*\) \{).*?(\n  \})/) { m ->
                m[1] + '\n' +
                "    // narwhal native patch (mybatis/spring#929): stock scan would re-register mappers\n" +
                "    // with raw Class<?> properties under by-type autowiring, which fails at image runtime.\n" +
                "    RootBeanDefinition beanDefinition = new RootBeanDefinition(MapperScannerConfigurer.class);\n" +
                "    beanDefinition.setRole(BeanDefinition.ROLE_INFRASTRUCTURE);\n" +
                "    beanDefinition.setAbstract(true);\n" +
                "    return beanDefinition;" + m[2]
            }
            s = s.replaceAll(/(?m)^\s*beanDefinition\.getPropertyValues\(\)\.addPropertyValue\("(annotationClass|markerInterface)", [\w.]+\.class\);\r?\n/, '')
            registrarDef.text = s
        }

        // mybatis-plus's AutoConfiguredMapperScannerRegistrar sets a raw Class<?> "annotationClass"
        // property on its MapperScannerConfigurer definition — same autowire trap. Strip it from
        // every MP-generated definition so the stock scan never resurrects java.lang.Class<?>.
        new File(aotRoot, 'com/baomidou').traverse(type: groovy.io.FileType.FILES, nameFilter: ~/.*\.java/) { f ->
            def s = f.text
            if (s.contains('addPropertyValue("annotationClass"') || s.contains('addPropertyValue("markerInterface"')) {
                f.text = s.replaceAll(/(?m)^\s*beanDefinition\.getPropertyValues\(\)\.addPropertyValue\("(annotationClass|markerInterface)", [\w.]+\.class\);\r?\n/, '')
            }
        }
    }
}

tasks.named('compileAotJava') { dependsOn patchAotSources }

// Keep the plain jar enabled: GraalVM's nativeCompile runs against the AOT-processed
// classes, and buildUpdaterBinaries/native packaging both expect it to exist.
jar {
    enabled = true
}

bootJar {
    archiveFileName = "fly-narwhal-server-${project.version}.jar"
}

def generatedVersionSrcDir = layout.buildDirectory.dir("generated/sources/version/java")

tasks.register('generateVersionConfig') {
    outputs.dir(generatedVersionSrcDir)
    outputs.upToDateWhen { false }
    doLast {
        def dir = generatedVersionSrcDir.get().asFile
        def packagePath = new File(dir, "com/jankinwu/flynarwhal/web/config")
        packagePath.mkdirs()

        def buildTime = OffsetDateTime.now(ZoneOffset.ofHours(8)).format(DateTimeFormatter.ofPattern("yyyy-MM-dd HH:mm:ss"))
        def baseVersion = project.ext.baseVersion?.toString() ?: project.version.toString()
        def version = project.version.toString()
        def buildAuthxVerifier = "1".equals(System.getenv("FLY_NARWHAL_BUILD_AUTHX_VERIFIER"))
        def isFnAppEnv = System.getenv("IS_FN_APP")
        def gitBranch = ""
        try {
            def proc = ["bash", "-lc", "git rev-parse --abbrev-ref HEAD"].execute(null, project.rootDir)
            proc.waitFor()
            gitBranch = proc.in.text.trim()
        } catch (Exception ignored) {}
        def isFnApp = true

        def file = new File(packagePath, "BuildVersionConfiguration.java")
        file.text =
            "package com.jankinwu.flynarwhal.web.config;\n" +
            "\n" +
            "import org.springframework.context.annotation.Bean;\n" +
            "import org.springframework.context.annotation.Configuration;\n" +
            "\n" +
            "@Configuration\n" +
            "public class BuildVersionConfiguration {\n" +
            "    public static final String VERSION = \"" + version + "\";\n" +
            "    public static final String BASE_VERSION = \"" + baseVersion + "\";\n" +
            "    public static final String BUILD_TIME = \"" + buildTime + "\";\n" +
            "    public static final boolean BUILD_AUTHX_VERIFIER = " + buildAuthxVerifier + ";\n" +
            "    public static final boolean IS_FN_APP = " + isFnApp + ";\n" +
            "\n" +
            "    @Bean\n" +
            "    public BuildVersionInfo buildVersionInfo() {\n" +
            "        return new BuildVersionInfo(VERSION, BASE_VERSION, BUILD_TIME);\n" +
            "    }\n" +
            "\n" +
            "    public static final class BuildVersionInfo {\n" +
            "        private final String version;\n" +
            "        private final String baseVersion;\n" +
            "        private final String buildTime;\n" +
            "\n" +
            "        public BuildVersionInfo(String version, String baseVersion, String buildTime) {\n" +
            "            this.version = version;\n" +
            "            this.baseVersion = baseVersion;\n" +
            "            this.buildTime = buildTime;\n" +
            "        }\n" +
            "\n" +
            "        public String getVersion() {\n" +
            "            return version;\n" +
            "        }\n" +
            "\n" +
            "        public String getBaseVersion() {\n" +
            "            return baseVersion;\n" +
            "        }\n" +
            "\n" +
            "        public String getBuildTime() {\n" +
            "            return buildTime;\n" +
            "        }\n" +
            "    }\n" +
            "}\n"
    }
}

sourceSets {
    main {
        java {
            srcDir(generatedVersionSrcDir)
        }
    }
}

tasks.named('compileJava') {
    dependsOn(tasks.named('generateVersionConfig'))
}

def externalAuthxEnabled = (project.findProperty("externalAuthx")?.toString()?.toBoolean() ?: false) || "1".equals(System.getenv("FLY_NARWHAL_BUILD_AUTHX_VERIFIER"))
def authxVerifierDirEnv = System.getenv("FLY_NARWHAL_AUTHX_VERIFIER_DIR")
def authxVerifierSrcDir = authxVerifierDirEnv ? file(authxVerifierDirEnv) : null
def authxVerifierWorkDir = layout.buildDirectory.dir("authx-verifier/work")
def authxVerifierResDir = layout.buildDirectory.dir("generated-resources/authx-verifier")
def execOps = project.services.get(ExecOperations)
def fsOps = project.services.get(FileSystemOperations)

def updaterSrcDir = rootProject.file("fly-narwhal-updater")
def updaterResDir = layout.buildDirectory.dir("generated-resources/updater")

def md5Hex = { String input ->
    def md = MessageDigest.getInstance("MD5")
    def digest = md.digest(input.getBytes("UTF-8"))
    return digest.collect { String.format("%02x", it) }.join("")
}

tasks.register('buildUpdaterBinaries') {
    onlyIf { updaterSrcDir != null && updaterSrcDir.exists() }
    outputs.dir(updaterResDir)
    doLast {
        def outDir = new File(updaterResDir.get().asFile, "updater")
        outDir.mkdirs()

        execOps.exec {
            workingDir(updaterSrcDir)
            def currentPath = System.getenv("PATH")
            def basePath = "/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/opt/homebrew/bin"
            environment("PATH", (currentPath == null || currentPath.trim().isEmpty()) ? basePath : (currentPath + ":" + basePath))
            environment("OUTPUT_DIR", outDir.absolutePath)
            commandLine("/bin/bash", "./build.sh")
        }

        def expected = [
            "updater-linux-amd64",
            "updater-linux-aarch64"
        ]
        for (def name : expected) {
            def bin = new File(outDir, name.toString())
            if (!bin.exists()) {
                throw new GradleException("Missing updater binary: " + bin.absolutePath)
            }
            bin.setExecutable(true)
        }
    }
}

tasks.register('prepareAuthxVerifier') {
    onlyIf { externalAuthxEnabled && authxVerifierSrcDir != null && authxVerifierSrcDir.exists() }
    doLast {
        def workDir = authxVerifierWorkDir.get().asFile
        if (workDir.exists()) {
            workDir.deleteDir()
        }
        fsOps.copy {
            from(authxVerifierSrcDir)
            into(workDir)
        }

        def secret = System.getenv("FLY_NARWHAL_API_SECRET")
        if (secret == null || secret.trim().isEmpty()) {
            throw new GradleException("FLY_NARWHAL_API_SECRET is required when building authx verifier binaries")
        }

        execOps.exec {
            workingDir(workDir)
            environment("AUTHX_SECRET", secret.trim())
            commandLine("go", "run", "./cmd/gensecret")
        }
    }
}

tasks.register('buildAuthxVerifierBinaries') {
    onlyIf { externalAuthxEnabled && authxVerifierSrcDir != null && authxVerifierSrcDir.exists() }
    dependsOn(tasks.named('prepareAuthxVerifier'))
    doLast {
        def workDir = authxVerifierWorkDir.get().asFile
        def outRoot = new File(authxVerifierResDir.get().asFile, "native/authx")
        def targets = [
            [os: "linux", arch: "amd64", ext: ""],
            [os: "linux", arch: "arm64", ext: ""],
            [os: "darwin", arch: "amd64", ext: ""],
            [os: "darwin", arch: "arm64", ext: ""],
            [os: "windows", arch: "amd64", ext: ".exe"],
            [os: "windows", arch: "arm64", ext: ".exe"]
        ]

        for (def t : targets) {
            def classifier = "${t.os}-${t.arch}".toString()
            def outDir = new File(outRoot, classifier)
            outDir.mkdirs()
            def outFile = new File(outDir, "flynarwhal-authx${t.ext}".toString())

            execOps.exec {
                workingDir(workDir)
                environment("CGO_ENABLED", "0")
                environment("GOOS", t.os)
                environment("GOARCH", t.arch)
                commandLine("go", "build", "-tags", "secretgen", "-trimpath", "-ldflags", "-s -w", "-o", outFile.absolutePath, "./cmd/verifier")
            }
        }
    }
}

tasks.register('verifyAuthxVerifierBinary') {
    onlyIf { externalAuthxEnabled && authxVerifierSrcDir != null && authxVerifierSrcDir.exists() }
    dependsOn(tasks.named('buildAuthxVerifierBinaries'))
    doLast {
        def secret = System.getenv("FLY_NARWHAL_API_SECRET")
        if (secret == null || secret.trim().isEmpty()) {
            throw new GradleException("FLY_NARWHAL_API_SECRET is required when verifying authx verifier binaries")
        }

        def now = System.currentTimeMillis().toString()
        def nonce = "123456"
        def url = "/api/danmu/ping"
        def dataMd5 = md5Hex("")
        def signStr = ["NDzZTVxnRKP8Z0jXg1VAMonaG8akvh", url, nonce, now, dataMd5, secret.trim()].join("_")
        def sign = md5Hex(signStr)
        def authx = "nonce=${nonce}&timestamp=${now}&sign=${sign}"
        def publicKey = "dummy-public-key"
        def signxStr = [now, nonce, sign, dataMd5, url, publicKey].join("_")
        def signx = MessageDigest.getInstance("SHA-256")
            .digest(signxStr.getBytes("UTF-8"))
            .collect { String.format("%02x", it) }
            .join("")

        def os = System.getProperty("os.name", "").toLowerCase()
        def arch = System.getProperty("os.arch", "").toLowerCase()
        def osPart = os.contains("linux") ? "linux" : (os.contains("mac") || os.contains("darwin")) ? "darwin" : os.contains("windows") ? "windows" : "unknown"
        def archPart = (arch.contains("aarch64") || arch.contains("arm64")) ? "arm64" : (arch.contains("x86_64") || arch.contains("amd64") || arch.contains("x64")) ? "amd64" : "unknown"
        def ext = osPart == "windows" ? ".exe" : ""

        def bin = new File(authxVerifierResDir.get().asFile, "native/authx/${osPart}-${archPart}/flynarwhal-authx${ext}".toString())
        if (!bin.exists()) {
            throw new GradleException("Missing authx verifier binary: " + bin.absolutePath)
        }
        bin.setExecutable(true)

        execOps.exec {
            commandLine(
                bin.absolutePath,
                "--authx", authx,
                "--url", url,
                "--data-md5", dataMd5,
                "--signx", signx,
                "--public-key", publicKey
            )
        }
    }
}

tasks.named('processResources') {
    dependsOn(tasks.named('buildUpdaterBinaries'))
    from(updaterResDir) {
        into("")
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
    if (externalAuthxEnabled && authxVerifierSrcDir != null && authxVerifierSrcDir.exists()) {
        dependsOn(tasks.named('buildAuthxVerifierBinaries'))
        from(authxVerifierResDir) {
            into("")
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        }
    }
}

tasks.named('bootJar') {
    dependsOn(tasks.named('buildUpdaterBinaries'))
    // processAot emits its own META-INF/native-image hints alongside the hand-written ones in
    // src/main/resources. Both describe the same classes and the packaged jar only needs one copy;
    // the main-source entries are the superset, so keep whichever is seen first.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.matching { it.name == "bootRun" }.configureEach {
    dependsOn(tasks.named('buildUpdaterBinaries'))
}
