<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>飞鲸影视 · 应用宣传海报（A 方案四联）</title>
<style>
    /* ============ 设计稿页壳 ============ */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro SC", "SF Pro Text", "PingFang SC",
            "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: #E8E8ED;
        padding: 48px 32px 96px;
        -webkit-font-smoothing: antialiased;
    }
    .page-head { max-width: 1360px; margin: 0 auto 40px; }
    .page-head h1 { font-size: 24px; letter-spacing: -0.02em; color: #1D1D1F; }
    .page-head p { font-size: 14px; color: #86868B; margin-top: 8px; max-width: 760px; line-height: 1.6; }
    .board {
        max-width: 1360px; margin: 0 auto;
        display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
        gap: 40px; align-items: start;
    }
    .concept { display: flex; flex-direction: column; gap: 14px; }
    .concept__label { font-size: 13px; font-weight: 650; color: #424245; letter-spacing: 0.04em; }
    .concept__label small { display: block; font-weight: 400; color: #86868B; margin-top: 3px; letter-spacing: 0; }
    /* 海报原尺寸 1920×1080 横幅（16:9），缩放到 460px 宽预览 */
    .frame { width: 460px; height: 258.75px; overflow: hidden; border-radius: 12px;
        box-shadow: 0 28px 70px rgba(0,0,0,0.22); }
    .poster { width: 1920px; height: 1080px; transform: scale(0.2396); transform-origin: top left;
        position: relative; overflow: hidden; }

    /* ============ 共享的品牌元素（取自落地页） ============ */
    .grad-text {
        background: linear-gradient(94deg, #007AFF 8%, #5E5CE6 55%, #BF5AF2 98%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .platforms { display: flex; align-items: center; gap: 30px; }
    .platforms svg { fill: currentColor; }
    .chip {
        display: inline-flex; padding: 9px 22px; border-radius: 999px;
        font-size: 23px; font-weight: 600;
        background: rgba(0, 122, 255, 0.08); border: 1px solid rgba(0, 122, 255, 0.16); color: #0062CC;
    }

    /* ============ 海报通用结构（A 方案浅色主题 · 横幅左文右图） ============ */
    .po {
        background: linear-gradient(180deg, #FFFFFF 0%, #F5F5F7 55%, #EDF1F7 100%);
        display: flex; align-items: center;
        padding: 0 110px;
    }
    .po::before { /* hero glow */
        content: ''; position: absolute; top: -18%; left: 62%; translate: -50% 0;
        width: 1500px; height: 900px;
        background: radial-gradient(circle at 50% 40%, rgba(0,122,255,0.17) 0%, rgba(0,122,255,0.07) 38%, transparent 68%);
    }
    .po::after { /* hero grid */
        content: ''; position: absolute; inset: 0;
        background-image: linear-gradient(rgba(0,0,0,0.028) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0,0,0,0.028) 1px, transparent 1px);
        background-size: 64px 64px;
        mask-image: radial-gradient(circle at 64% 42%, #000 0%, transparent 70%);
        -webkit-mask-image: radial-gradient(circle at 64% 42%, #000 0%, transparent 70%);
    }
    .po > * { position: relative; z-index: 1; }

    .po .col { width: 850px; flex-shrink: 0; text-align: left; }

    .po .pill {
        display: inline-flex; align-items: center; gap: 12px;
        padding: 11px 30px; border-radius: 999px;
        border: 1px solid rgba(0,122,255,0.22); background: rgba(0,122,255,0.07);
        color: #0062CC; font-size: 24px; font-weight: 650; letter-spacing: 0.03em;
    }
    .po .pill img { width: 40px; height: 40px; border-radius: 22%;
        box-shadow: 0 4px 12px rgba(0,122,255,0.25); }
    .po .title {
        font-size: 96px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1;
        color: #1D1D1F; margin-top: 34px;
    }
    .po .lede {
        font-size: 28px; line-height: 1.62; color: #86868B;
        max-width: 720px; margin-top: 24px;
    }
    .po .cta {
        display: inline-flex; align-items: center; gap: 12px; margin-top: 40px;
        background: #007AFF; color: #fff; font-size: 27px; font-weight: 600;
        padding: 20px 46px; border-radius: 999px; box-shadow: 0 10px 28px rgba(0,122,255,0.36);
    }
    .po .chips { display: flex; flex-wrap: wrap; gap: 14px;
        margin-top: 30px; max-width: 800px; }

    /* 窗口截图卡 —— 与落地页 ScreenshotSection 同款 chrome */
    .po .shot {
        margin-left: 60px; flex: 1; max-width: 880px; border-radius: 18px; overflow: hidden;
        background: #fff; border: 1px solid rgba(0,0,0,0.08);
        box-shadow: 0 28px 70px rgba(0,0,0,0.14), 0 0 90px rgba(0,122,255,0.10);
    }
    .po .shot__chrome {
        display: flex; align-items: center; gap: 9px; padding: 13px 16px;
        background: #EDEDF0; border-bottom: 1px solid rgba(0,0,0,0.08);
    }
    .po .shot__dot { width: 13px; height: 13px; border-radius: 50%; background: rgba(0,0,0,0.16); }
    .po .shot img { width: 100%; display: block; }

    .po .foot {
        position: absolute; left: 110px; right: 110px; bottom: 46px;
        display: flex; align-items: center; justify-content: space-between;
    }
    .po .foot .platforms { color: #55555A; }
    .po .foot .brand { font-size: 23px; color: #86868B; letter-spacing: 0.05em; }
</style>
