<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="飞鲸影视 2.0 焕新出发——面向飞牛影视服务的第三方桌面客户端。Flutter 原生重写，内置 mpv 播放内核，覆盖 Windows、macOS、Linux，支持智能跳过片头片尾与弹幕。">
    <meta name="theme-color" content="#F5F5F7">
    <link rel="icon" type="image/png" href="/img/app-icon.png">
    <title>飞鲸影视 2.0 · 焕新出发 | 第三方飞牛影视桌面客户端</title>
    <!-- Applies the initial theme before first paint so a dark-preference
         reload never flashes light. The stored value is 'light', 'dark' or
         'system'; 'system' (and no stored value at all) resolves to the OS
         setting here, and useTheme.js keeps following it live.
         Mirrored by src/composables/useTheme.js (same key and fallbacks). -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('fwn:ui:theme')
                if (t !== 'light' && t !== 'dark') {
                    t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
                }
                document.documentElement.setAttribute('data-theme', t)
                var m = document.querySelector('meta[name="theme-color"]')
                if (m) m.setAttribute('content', t === 'dark' ? '#0A0A0C' : '#F5F5F7')
            } catch (e) {
                // localStorage blocked (private mode etc.) — stay light.
            }
        })()
    </script>
    <!-- Applies the initial UI language before first paint, same idea as the
         theme script above: a stored pick wins, otherwise detect from the
         browser (zh-TW/HK/Hant → Traditional, other zh → Simplified, anything
         else → English). Only `lang` is set here; the title and description
         stay Simplified until useI18n.js applies them on load, since a SPA
         paints no server-rendered copy for them to lead.
         Mirrored by src/composables/useI18n.js (same key, same detection
         order), which reads documentElement.lang back as its initial value. -->
    <script>
        (function () {
            try {
                var l = localStorage.getItem('fwn:ui:locale')
                if (l !== 'zh-CN' && l !== 'zh-TW' && l !== 'en') {
                    l = 'en'
                    var tags = navigator.languages || [navigator.language || '']
                    for (var i = 0; i < tags.length; i++) {
                        var s = String(tags[i]).toLowerCase()
                        if (/^zh-(tw|hk|mo|hant)/.test(s)) { l = 'zh-TW'; break }
                        if (s.indexOf('zh') === 0) { l = 'zh-CN'; break }
                        if (s.indexOf('en') === 0) { l = 'en'; break }
                    }
                }
                document.documentElement.setAttribute('lang', l)
            } catch (e) {
                // localStorage blocked (private mode etc.) — stay on the
                // static <html lang> default.
            }
        })()
    </script>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
